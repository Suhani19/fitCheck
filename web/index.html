<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FitCheck — AI Real-Time Interview Simulation & Screening. Practice with ruthless AI interviewers and master technical bar-raising rounds.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FitCheck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicons supporting light & dark browser chrome -->
  <link rel="icon" type="image/png" href="favicon-dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>FitCheck — AI Real-Time Interview Simulation & Screening</title>
  <link rel="manifest" href="manifest.json">

  <!-- Agora Web SDK & Iris Core for Real-time Voice/Audio on Flutter Web -->
  <script src="https://download.agora.io/sdk/release/iris-web-rtc_n450_w4220_0.8.6.js"></script>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

  <!-- Web Speech API Normalization for browser speech recognition -->
  <script>
    if (!window.SpeechRecognition && window.webkitSpeechRecognition) {
      window.SpeechRecognition = window.webkitSpeechRecognition;
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
